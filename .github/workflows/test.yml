name: test

# 纯文档推送/PR 不触发本工作流；过滤清单在 push 与 pull_request 两处需同步维护，详见 docs/agents/ci-triage.md
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - 'openspec/**'
      - '.agents/**'
      - '.claude/**'
      - '.kimi-code/**'
      - '.qoder/**'
      - '.opencode/**.md'
      - '.github/**.md'
      - '*.md'
      - '**/README.md'
      - '**/AGENTS.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - 'openspec/**'
      - '.agents/**'
      - '.claude/**'
      - '.kimi-code/**'
      - '.qoder/**'
      - '.opencode/**.md'
      - '.github/**.md'
      - '*.md'
      - '**/README.md'
      - '**/AGENTS.md'
  workflow_dispatch:

concurrency:
  # Keep every run on main so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ github.ref == 'refs/heads/main' && format('{0}-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "opennovel-bot"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Install Playwright browsers
        run: bunx playwright@1.60.0 install chromium

      - name: Run unit tests
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo test
        env:
          OPENNOVEL_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}
          # Windows runner 上 headless Chromium launch 稳定挂死（180s 超时），仅 runner 跳过
          # 浏览器集成套件；Linux CI 与本地开发机不受影响。见 tool-browser.test.ts 同名注释。
          OPENNOVEL_TEST_SKIP_HEADLESS_BROWSER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated

      # 暂时仅在 Linux 运行：bun-pty 的 FFI spawn 在 Windows 上始终失败，
      # effect 模式的 pty.create 会稳定返回 500。修复 Windows PTY 后再放开。
      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        timeout-minutes: 30
        working-directory: packages/opennovel
        run: bun run test:httpapi

      - name: Run technique agent e2e gates
        # technique-agent-e2e：默认套件 env 门跳过（Windows unit 步 20min 上限内无时长余量），
        # 由本步在 Linux 常驻运行，等价 httpapi exerciser 的 gating 先例。
        if: runner.os == 'Linux'
        timeout-minutes: 30
        working-directory: packages/opennovel
        run: bun run test:technique-e2e

  node-runtime:
    # node:sqlite 驱动冒烟（unified-transactions）：bun:sqlite 会静默放过嵌套 begin 等
    # 驱动层错误，bun 测试存在盲区；本 job 以 bun build --target=node 打包（#driver 解析到
    # node 条件）后经 setup-node 的 Node 24 跑 node --test，覆盖 withTransaction 三错误形态、
    # Phase 1 四步原子性、嵌套 savepoint 与同步队列消费 + 真实章节重建 handler 链。
    name: node-runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build node-runtime test bundles
        run: |
          bun build --target=node --outfile /tmp/ns-with-transaction.mjs packages/novel-store/test-node/with-transaction.node.ts
          bun build --target=node --outfile /tmp/opennovel-sync-consume.mjs packages/opennovel/test-node/sync-consume.node.ts

      - name: Verify bundles resolved the node driver condition
        run: |
          for f in /tmp/ns-with-transaction.mjs /tmp/opennovel-sync-consume.mjs; do
            grep -q "setReturnArrays" "$f"
            ! grep -q "bun:sqlite" "$f"
          done

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Run node-runtime tests
        timeout-minutes: 10
        run: node --test /tmp/ns-with-transaction.mjs /tmp/opennovel-sync-consume.mjs

  e2e:
    name: e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
