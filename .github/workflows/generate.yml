name: generate

# 纯文档推送/PR 不触发本工作流；过滤清单在 push 与 pull_request 两处需同步维护，详见 docs/agents/ci-triage.md
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - 'openspec/**'
      - '.agents/**'
      - '.claude/**'
      - '.kimi-code/**'
      - '.qoder/**'
      - '.opencode/**.md'
      - '.github/**.md'
      - '*.md'
      - '**/README.md'
      - '**/AGENTS.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - 'openspec/**'
      - '.agents/**'
      - '.claude/**'
      - '.kimi-code/**'
      - '.qoder/**'
      - '.opencode/**.md'
      - '.github/**.md'
      - '*.md'
      - '**/README.md'
      - '**/AGENTS.md'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate generated output
        run: |
          ./script/generate.ts
          git diff --exit-code
