name: Release

# 统一 release 流程：prepare → build → publish
# 触发方式：手动 workflow_dispatch，选择 bump 类型和 channel
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: "Release channel"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - beta
          - prod

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ========== 阶段 1：准备 release ==========
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.version.outputs.release_id }}
      channel: ${{ steps.version.outputs.channel }}
      product_channel: ${{ inputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git
        run: |
          git config --global user.name "opennovel-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and push
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENNOVEL_BUMP: ${{ inputs.bump }}
          OPENNOVEL_CHANNEL: ${{ inputs.channel == 'prod' && 'latest' || inputs.channel }}
        run: |
          set -e
          echo "Bumping version..."
          bun script/bump-version.ts

      - name: Install .opencode dependencies
        run: bun install --cwd .opencode

      - name: Generate changelog and create draft release
        id: version
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENNOVEL_BUMP: ${{ inputs.bump }}
          OPENNOVEL_CHANNEL: ${{ inputs.channel == 'prod' && 'latest' || inputs.channel }}
          OPENNOVEL_RELEASE: "true"
          OPENNOVEL_AUTH_CONTENT: ${{ secrets.OPENNOVEL_AUTH_CONTENT }}
        run: |
          set -eo pipefail
          SUMMARY=$(bun script/version.ts | tail -n 1)
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$SUMMARY" | jq -r '.version')" >> "$GITHUB_OUTPUT"
          echo "commit=$(echo "$SUMMARY" | jq -r '.commit')" >> "$GITHUB_OUTPUT"
          echo "tag=$(echo "$SUMMARY" | jq -r '.tag')" >> "$GITHUB_OUTPUT"
          echo "release_id=$(echo "$SUMMARY" | jq -r '.release')" >> "$GITHUB_OUTPUT"
          echo "channel=$(echo "$SUMMARY" | jq -r '.channel')" >> "$GITHUB_OUTPUT"
          echo "Generated summary: $SUMMARY"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upcoming-changelog
          path: UPCOMING_CHANGELOG.md
          retention-days: 30
          if-no-files-found: ignore

  # ========== 阶段 2：构建 Windows 安装包 ==========
  build-windows:
    name: Build Windows installer
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      OPENNOVEL_CHANNEL: ${{ needs.prepare.outputs.product_channel }}
      EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      WIN_CSC_LINK: ""
      WIN_CSC_KEY_PASSWORD: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Verify checked-out release commit and version
        run: |
          set -euo pipefail
          ACTUAL_COMMIT=$(git rev-parse HEAD)
          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "Release commit mismatch: expected $EXPECTED_COMMIT, got $ACTUAL_COMMIT"
            exit 1
          fi

          ACTUAL_VERSION=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' packages/desktop/package.json | head -n 1)
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Desktop version mismatch: expected $EXPECTED_VERSION, got $ACTUAL_VERSION"
            exit 1
          fi

      - name: Verify reusable draft release
        if: needs.prepare.outputs.product_channel != 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG=$(gh release view "$TAG" --json tagName --jq '.tagName')
          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [ "$RELEASE_TAG" != "$TAG" ] || [ "$IS_DRAFT" != "true" ]; then
            echo "Expected draft release $TAG, got tag=$RELEASE_TAG draft=$IS_DRAFT"
            exit 1
          fi

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build and publish package
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$OPENNOVEL_CHANNEL" = "dev" ]; then
            PUBLISH_MODE=never
            # GH_TOKEN 会让 electron-builder 隐式推断 GitHub publish 配置，dev 必须完全禁用
            unset GH_TOKEN
          else
            PUBLISH_MODE=always
          fi
          echo "Building $OPENNOVEL_CHANNEL with --publish=$PUBLISH_MODE"
          bun run build
          bun run package:win -- "--publish=$PUBLISH_MODE"

          if [ "$OPENNOVEL_CHANNEL" = "dev" ]; then
            # electron-builder 会无条件为 NSIS 在本地 dist 生成 blockmap 与 updater
            # 元数据（设计如此，供手动更新测试使用），dev 交付前必须移除这些文件。
            rm -f dist/*.blockmap dist/latest*.yml dist/beta.yml dist/alpha.yml
          fi

      - name: Validate built artifacts
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(dist/opennovel-desktop-win-*.exe)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "Missing Windows installer"
            exit 1
          fi

          if [ "$OPENNOVEL_CHANNEL" = "dev" ]; then
            blockmaps=(dist/*.blockmap)
            metadata=(dist/latest*.yml dist/beta.yml dist/alpha.yml)
            if [ ${#blockmaps[@]} -ne 0 ] || [ ${#metadata[@]} -ne 0 ]; then
              echo "Dev release must not contain blockmap or updater metadata"
              exit 1
            fi
          else
            metadata=latest.yml
            if [ "$OPENNOVEL_CHANNEL" = "beta" ]; then
              metadata=beta.yml
            fi

            for installer in "${installers[@]}"; do
              if [ ! -f "$installer.blockmap" ]; then
                echo "Missing blockmap for $installer"
                exit 1
              fi
            done

            if [ ! -f "dist/$metadata" ]; then
              echo "Missing updater metadata: $metadata"
              exit 1
            fi
          fi

      - name: Upload dev artifacts
        if: needs.prepare.outputs.product_channel == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/opennovel-desktop-win-*.exe)
          for file in "${files[@]}"; do
            gh release upload "$TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"
          done

      - name: Validate uploaded release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE_RELEASE_ID=$(gh release view "$TAG" --json databaseId --jq '.databaseId')
          if [ "$REMOTE_RELEASE_ID" != "$RELEASE_ID" ]; then
            echo "Unexpected release $REMOTE_RELEASE_ID; expected prepared release $RELEASE_ID"
            exit 1
          fi

          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          asset_exists() {
            grep -Fxq -- "$1" <<<"$assets"
          }

          mapfile -t installers < <(grep -E '^opennovel-desktop-win-.+\.exe$' <<<"$assets" || true)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "Release $TAG is missing a Windows installer"
            exit 1
          fi

          if [ "$OPENNOVEL_CHANNEL" = "dev" ]; then
            while IFS= read -r asset; do
              if [[ "$asset" != *.exe ]]; then
                echo "Dev release contains unexpected asset: $asset"
                exit 1
              fi
            done <<<"$assets"
          else
            metadata=latest.yml
            if [ "$OPENNOVEL_CHANNEL" = "beta" ]; then
              metadata=beta.yml
            fi

            for installer in "${installers[@]}"; do
              if ! asset_exists "$installer.blockmap"; then
                echo "Release $TAG is missing blockmap: $installer.blockmap"
                exit 1
              fi
            done

            if ! asset_exists "$metadata"; then
              echo "Release $TAG is missing updater metadata: $metadata"
              exit 1
            fi

            validation_dir=$(mktemp -d)
            gh release download "$TAG" --pattern "$metadata" --dir "$validation_dir" --clobber
            metadata_version=$(sed -n 's/^version:[[:space:]]*//p' "$validation_dir/$metadata" | head -n 1)
            if [ "$metadata_version" != "$EXPECTED_VERSION" ]; then
              echo "Updater version mismatch: expected $EXPECTED_VERSION, got $metadata_version"
              exit 1
            fi
          fi

  # TODO: 未来扩展 macOS
  # build-macos:
  #   name: Build macOS installer
  #   needs: prepare
  #   runs-on: macos-latest
  #   steps: ...

  # TODO: 未来扩展 Linux
  # build-linux:
  #   name: Build Linux installer
  #   needs: prepare
  #   runs-on: ubuntu-latest
  #   steps: ...

  # ========== 阶段 3：发布 release ==========
  publish:
    name: Publish release
    needs:
      - prepare
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "Publishing release $TAG"
          gh release edit "$TAG" --draft=false --repo ${{ github.repository }}

      - name: Summary
        run: |
          echo "## Release Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ needs.prepare.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Channel: ${{ needs.prepare.outputs.product_channel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: ${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
